# Render Blueprint: backend (Express API)
services:
  - type: web
    name: tradeguru-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ONNXRUNTIME_NODE_INSTALL   # skip optional GPU (CUDA) download
        value: skip
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI                  # paste your MongoDB Atlas link in the Render dashboard
        sync: false
      - key: CLIENT_URL                 # your Vercel URL, e.g. https://tradeguru.vercel.app
        sync: false
